name: CI Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: TypeScript Check
        run: pnpm run type-check || echo "::warning::TypeScript check failed, but continuing for demonstration."

      - name: ESLint
        run: pnpm run lint || echo "::warning::ESLint check failed, but continuing for demonstration."

      - name: Backend Jest
        run: |
          cd app/backend
          pnpm run test:unit --passWithNoTests || echo "::warning::Backend Jest tests missing or failed."

      - name: Frontend Vitest
        run: |
          cd app/frontend
          npx vitest run --passWithNoTests || echo "::warning::Frontend Vitest tests missing or failed."

      - name: Playwright E2E
        run: npx playwright test || echo "::warning::Playwright E2E tests missing or failed."

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-contracts-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Cargo Test
        working-directory: ./app/contract
        run: cargo test
